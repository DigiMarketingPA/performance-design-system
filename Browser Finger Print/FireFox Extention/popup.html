<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Anti-Fingerprinting Extension</title>
  <style>
    body {
      width: 400px;
      padding: 10px;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .header img {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }
    .header h2 {
      margin: 0;
      color: #333;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      text-align: center;
      font-weight: bold;
    }
    .status.warning {
      background-color: #ff9800;
    }
    .status.error {
      background-color: #f44336;
    }
    .ublock-status {
      margin: 10px 0;
      padding: 8px;
      border-radius: 4px;
      background-color: #fff;
      text-align: center;
      border: 1px solid #ddd;
    }
    .ublock-status.installed {
      color: #4CAF50;
      border-color: #4CAF50;
    }
    .ublock-status.not-installed {
      color: #f44336;
      border-color: #f44336;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background-color: #2196F3;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0b7dda;
    }
    button.secondary {
      background-color: #607D8B;
    }
    button.secondary:hover {
      background-color: #455A64;
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background-color: #fff;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: 12px;
      color: #666;
    }
    .log-section {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    .log-entry {
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #eee;
      border-radius: 4px;
    }
    .blocked {
      background-color: #ffebee;
    }
    .modified {
      background-color: #e8f5e9;
    }
    .timestamp {
      font-size: 0.8em;
      color: #666;
    }
    .url {
      font-weight: bold;
      word-break: break-all;
    }
    .details {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/shield-48.png" alt="Privacy Shield">
    <h2>Privacy Shield</h2>
  </div>
  <div class="status">Privacy Protection Active</div>
  <div class="ublock-status" id="ublockStatus">Checking uBlock Origin status...</div>
  <div class="controls">
    <button id="whitelist">Whitelist Current Site</button>
    <button id="disable" class="secondary">Disable Protection</button>
    <button id="openUblock">Open uBlock Origin Dashboard</button>
  </div>
  <div class="info">
    <p>Privacy Shield is actively protecting your browser from fingerprinting and tracking.</p>
    <p>Current site: <span id="currentSite">Loading...</span></p>
  </div>
  <div class="log-section">
    <h3>Recent Activity</h3>
    <div id="logs"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
