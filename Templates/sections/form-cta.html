<!-- Form CTA start -->
<!-- Requires: css/tpl.css + css/tpl-{brand}.css in Head/Header. -->
<div class="tpl-root" id="form">
  <div class="tpl-section">
    <div class="tpl-container">
      <div class="tpl-panel">
        <h2>Lorem Ipsum Contact Form</h2>
        <p class="tpl-lead">Call <a href="tel:5555555555"><strong>(555) 555-5555</strong></a>. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        <!-- Live: [gravityform id="3" title="false" description="false"] -->
        <form class="tpl-form" action="#" method="post">
          <div>
            <label for="formcta-name">Name</label>
            <input id="formcta-name" name="name" type="text" placeholder="Lorem Ipsum">
          </div>
          <div>
            <label for="formcta-email">Email</label>
            <input id="formcta-email" name="email" type="email" placeholder="lorem@ipsum.com">
          </div>
          <div>
            <label for="formcta-phone">Phone</label>
            <input id="formcta-phone" name="phone" type="tel" placeholder="(555) 555-5555">
          </div>
          <div>
            <label for="formcta-message">Message</label>
            <textarea id="formcta-message" name="message" placeholder="Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."></textarea>
          </div>
          <button class="button button--primary button--normal" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Form CTA end -->
