<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA Design System — Local Preview Catalog</title>

  <!-- Tier 1: core (always first) -->
  <link rel="stylesheet" href="../css/pa-core.css">

  <!-- Tier 2: brand theme (swapped at runtime by the brand switcher) -->
  <link id="pa-brand-sheet" rel="stylesheet" href="../css/brands/pa-brand-toyota.css">

  <!-- Tier 3: every module sheet, so any snippet renders in the catalog -->
  <link rel="stylesheet" href="../css/modules/content-media.css">
  <link rel="stylesheet" href="../css/modules/coupons.css">
  <link rel="stylesheet" href="../css/modules/cta-row.css">
  <link rel="stylesheet" href="../css/modules/deal-carousel.css">
  <link rel="stylesheet" href="../css/modules/faq.css">
  <link rel="stylesheet" href="../css/modules/form-cta.css">
  <link rel="stylesheet" href="../css/modules/hero.css">
  <link rel="stylesheet" href="../css/modules/hours.css">
  <link rel="stylesheet" href="../css/modules/location-cards.css">
  <link rel="stylesheet" href="../css/modules/map-cta.css">
  <link rel="stylesheet" href="../css/modules/meet-team.css">
  <link rel="stylesheet" href="../css/modules/page-header.css">
  <link rel="stylesheet" href="../css/modules/promo.css">
  <link rel="stylesheet" href="../css/modules/store-directory.css">

  <style>
    /* Preview chrome only — NOT part of the pa- design system. */
    :root { --pv-bar: #0f172a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #eef2f7; color: #0f172a; }
    .pv-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; flex-wrap: wrap; align-items: center; gap: 1rem;
      padding: 0.85rem 1.25rem; background: var(--pv-bar); color: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,0.25);
    }
    .pv-bar strong { font-size: 0.95rem; letter-spacing: 0.02em; }
    .pv-bar label { font-size: 0.8rem; opacity: 0.85; }
    .pv-bar select {
      font: inherit; padding: 0.35rem 0.6rem; border-radius: 0.4rem;
      border: 1px solid #334155; background: #1e293b; color: #fff;
    }
    .pv-bar .pv-count { margin-left: auto; font-size: 0.8rem; opacity: 0.85; }
    .pv-wrap { max-width: 90rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .pv-snippet { margin: 0 0 1.75rem; background: #fff; border: 1px solid #d7dee8; border-radius: 0.75rem; overflow: hidden; }
    .pv-snippet > header {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.6rem 1rem; background: #f1f5f9; border-bottom: 1px solid #d7dee8;
      font-size: 0.8rem; font-weight: 600; color: #334155;
    }
    .pv-snippet > header code { font-weight: 700; color: #0f172a; }
    .pv-snippet > .pv-body { padding: 1.25rem; }
    .pv-error { color: #b91c1c; font-size: 0.85rem; padding: 1rem; }
  </style>
</head>
<body>
  <div class="pv-bar">
    <strong>PA Design System — Preview Catalog</strong>
    <label for="pv-brand">Brand theme</label>
    <select id="pv-brand" aria-label="Brand theme">
      <option value="toyota">Toyota</option>
      <option value="honda">Honda</option>
      <option value="lexus">Lexus</option>
      <option value="ford">Ford</option>
      <option value="cjdr">CJDR</option>
    </select>
    <span class="pv-count" id="pv-count"></span>
  </div>

  <main class="pv-wrap" id="pv-catalog"></main>

  <script>
    // Local dev catalog loader — fetches each snippet body and renders it with
    // the live pa- stylesheets so components can be previewed while iterating.
    const SNIPPETS = [
      "page-header", "hero", "content-media", "cta-row", "location-cards",
      "deal-carousel", "coupons", "promo:trade-in", "promo:finance",
      "meet-team", "hours", "map-cta", "form-cta", "faq", "store-directory",
    ];

    const brandSheet = document.getElementById("pa-brand-sheet");
    document.getElementById("pv-brand").addEventListener("change", (e) => {
      brandSheet.href = `../css/brands/pa-brand-${e.target.value}.css`;
    });

    async function renderSnippet(entry) {
      const file = entry.includes(":") ? entry.split(":")[1] : entry;
      const section = document.createElement("section");
      section.className = "pv-snippet";
      const header = document.createElement("header");
      header.innerHTML = `<code>snippets/${file}.html</code>`;
      const body = document.createElement("div");
      body.className = "pv-body";
      section.append(header, body);
      document.getElementById("pv-catalog").appendChild(section);

      try {
        const res = await fetch(`../snippets/${file}.html`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        body.innerHTML = await res.text();
      } catch (err) {
        body.innerHTML = `<p class="pv-error">Failed to load snippets/${file}.html — ${err.message}</p>`;
      }
    }

    (async () => {
      for (const entry of SNIPPETS) {
        await renderSnippet(entry);
      }
      document.getElementById("pv-count").textContent = `${SNIPPETS.length} snippets`;

      // store-directory needs its companion JS. Its handler binds on
      // DOMContentLoaded (already fired), so load it then re-dispatch the event.
      const s = document.createElement("script");
      s.src = "../js/store-directory.js";
      s.onload = () => document.dispatchEvent(new Event("DOMContentLoaded"));
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
