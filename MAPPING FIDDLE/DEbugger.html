<style>
#results {
  display: none; /* Initially hide the results section */
}

button.locbtn {
  padding: 10px;
  margin-left: 25px;
  background:#2b6dad;
  color:white;
  border-radius: 3px;
  border: none
}

button.locbtn:hover {
  background:#3269a9;
}

.locbox {
  width: 300px;
  padding: 10px;
  margin: 10px 0 10px 0;
  border-radius: 3px;
  background: #eeeeee;
}

.evloc h1 {
    font-weight: 500;
}

.evloc h2 {
  font-size: 28px !important;
  font-weight: 500;
  text-decoration: underline !important; 
}

.locard {
    border: 1px solid #dddddd;
    padding: 2% 5%;
    width: fit-content;
    height: auto;
    box-shadow: 5px 5px 15px 1px #666666;
  background: white;
}

.vidbanner {
  position: relative;
  width: 100%;
}

.vidbanner video {
  width: 100%;
  height: auto;
}

.evheading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  background-color: rgba(0, 0, 0, 0.6);
  padding: 20px;
  border-radius: 5px;
}

.evheading h2 {
  margin-top: 0;
  font-weight: 600;
}

.evheading .button {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  background-color: #2b6dad;
  color: white;
  text-decoration: none;
  border-radius: 3px;
}

.evheading .button:hover {
  background-color: #3269a9;
}

.ankr h4 {
    display: flex;
    justify-content: space-evenly;
}

/* --- EV VIDEOS --- */
.eduvids {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 columns */
    gap: 20px;
    padding: 20px;
}

.video {
    position: relative;
    background-color: #e0e0e0;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.video video {
    width: 100%;
    height: auto;
}

.cover {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
    z-index: 1;
}

@media (max-width: 767px) {
    .eduvids {
        grid-template-columns: 1fr; /* Stack videos vertically on smaller screens */
    }
}

/* --- Benefit CARDS  ---*/
.benecon {
    display: grid;
    grid-template-columns: repeat(6, 1fr); /* 6 columns */
    gap: 20px;
    padding: 20px;
}

.benecard {
    background-color: #f0f0f0;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 150px;
    grid-column-start: span 2;
    grid-column-end: span 2;
    flex-direction: column;
}

.benecard:nth-child(4) {
    grid-column-start: 2;
    grid-column-end: 4;
}

.benecard:nth-child(5) {
    grid-column-start: 4;
    grid-column-end: 6;
}

@media (max-width: 767px) {
    .benecon {
        grid-template-columns: 1fr;
    }
    
    .benecard {
        grid-column: auto;
    }
}

.benecard img {
    mix-blend-mode: multiply; /* Adjust blend mode as needed */
}

.benecol h3 {
  font-size: 2rem;
}

</style>

<div class="locard">
    <h1>Find Nearest EV Fuel Stations</h1>
    
    <input class="locbox" type="text" id="location" placeholder="Enter Location (e.g., Zip or City)"> <button class="locbtn" onclick="fetchStations()">Find Stations</button>
    
    <div id="results">
      <h2>Results</h2>
      <ul id="stations-list"></ul>
    </div>
</div>

<script>
    async function fetchStations() {
      const location = document.getElementById('location').value;
      const apiKey = 'cBNrXmiD8IgoGJaEANaKLH6aF7coTNLoZvEQmQtL'; // Your API key
      const url = `https://developer.nrel.gov/api/alt-fuel-stations/v1/nearest.json?api_key=${apiKey}&location=${encodeURIComponent(location)}&fuel_type=ELEC`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        const stationsList = document.getElementById('stations-list');
        stationsList.innerHTML = ''; // Clear previous results
        
        // List of station names to exclude
        const excludeList = ['Wyler'];

        // Filter out stations by name
        const filteredStations = data.fuel_stations.filter(station => {
          return !excludeList.some(exclude => station.station_name.includes(exclude));
        });

        if (data.fuel_stations.length > 0) {
          data.fuel_stations.forEach(station => {
            const listItem = document.createElement('li');
            listItem.textContent = `${station.station_name} - ${station.street_address} ${station.city}, ${station.state} ${station.zip}`;
            stationsList.appendChild(listItem);
          });
        } else {
          stationsList.innerHTML = '<li>No EV charging stations found.</li>';
        }

        // Show the results section after data is loaded
        document.getElementById('results').style.display = 'block';
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }

document.querySelectorAll('.video').forEach(videoContainer => {
    const video = videoContainer.querySelector('video');
    const cover = videoContainer.querySelector('.cover');

    cover.addEventListener('click', () => {
        cover.style.display = 'none'; // Hide the cover image
        video.play(); // Play the video
    });
});
</script>
