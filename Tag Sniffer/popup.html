<!DOCTYPE html>
<html>
<head>
    <title>TagSniffer</title>
    <style>
        body {
            width: 400px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
        
        .container {
            margin: 0 auto;
        }
        
        #extractButton {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        #extractButton:hover {
            background-color: #45a049;
        }
        
        .loading {
            text-align: center;
            color: #666;
            padding: 10px;
        }
        
        .error {
            color: red;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        
        .tags-list, .scripts-list, .flagged-tags-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .tag-item, .script-item, .flagged-tag-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            word-break: break-all;
        }
        
        .tag-item:last-child, .script-item:last-child, .flagged-tag-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="extractButton">Extract Tags</button>
        <button id="clearButton">Clear Results</button>
        <div id="results"></div>
    </div>
    <script src="UI.js"></script>
</body>
</html>
