<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term Spider Cloud - Web Scraping Keyword Finder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .keyword-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .keyword-tag .remove {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .keyword-tag .remove:hover {
            opacity: 1;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .status-card {
            display: none;
        }

        .status-card.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e1e5e9;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .status-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .status-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .status-item .number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .status-item .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .results-table th,
        .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e1e5e9;
        }

        .results-table th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .results-table tr:hover {
            background: #f8f9fa;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .card {
                padding: 20px;
            }

            .status-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-spider"></i> Term Spider Cloud</h1>
            <p>Powerful web scraping keyword finder for detecting former company references</p>
        </div>

        <div class="card">
            <h2><i class="fas fa-cog"></i> Scan Configuration</h2>
            <form id="scanForm">
                <div class="form-group">
                    <label for="targetUrl">Target Website URL</label>
                    <input type="url" id="targetUrl" name="targetUrl" required 
                           placeholder="https://example.com">
                </div>

                <div class="form-group">
                    <label for="keywords">Keywords to Search</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="keywordInput" placeholder="Enter keyword and press Enter">
                        <button type="button" class="btn" onclick="addKeyword()">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                    <div id="keywordsContainer" class="keywords-container"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="maxPages">Maximum Pages</label>
                        <input type="number" id="maxPages" name="maxPages" value="50" min="1">
                    </div>

                    <div class="form-group">
                        <label for="requestDelay">Request Delay (ms)</label>
                        <input type="number" id="requestDelay" name="requestDelay" value="1000" min="500">
                    </div>
                </div>

                <button type="submit" class="btn" id="startScanBtn">
                    <i class="fas fa-play"></i> Start Scan
                </button>
            </form>
        </div>

        <div class="card status-card" id="statusCard">
            <h2><i class="fas fa-chart-line"></i> Scan Status</h2>
            <div id="statusContent">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="status-info" id="statusInfo"></div>
            </div>
        </div>

        <div class="card" id="resultsCard" style="display: none;">
            <h2><i class="fas fa-list"></i> Scan Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        let currentScanId = null;
        let statusInterval = null;
        let keywords = [];

        // Add keyword functionality
        function addKeyword() {
            const input = document.getElementById('keywordInput');
            const keyword = input.value.trim();
            
            if (keyword && !keywords.includes(keyword)) {
                keywords.push(keyword);
                updateKeywordsDisplay();
                input.value = '';
            }
        }

        function removeKeyword(keyword) {
            keywords = keywords.filter(k => k !== keyword);
            updateKeywordsDisplay();
        }

        function updateKeywordsDisplay() {
            const container = document.getElementById('keywordsContainer');
            container.innerHTML = keywords.map(keyword => `
                <div class="keyword-tag">
                    ${keyword}
                    <span class="remove" onclick="removeKeyword('${keyword}')">
                        <i class="fas fa-times"></i>
                    </span>
                </div>
            `).join('');
        }

        // Handle form submission
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (keywords.length === 0) {
                alert('Please add at least one keyword to search for.');
                return;
            }

            const formData = {
                targetUrl: document.getElementById('targetUrl').value,
                keywords: keywords,
                maxPages: parseInt(document.getElementById('maxPages').value),
                requestDelay: parseInt(document.getElementById('requestDelay').value)
            };

            await startScan(formData);
        });

        async function startScan(scanData) {
            try {
                const startBtn = document.getElementById('startScanBtn');
                startBtn.disabled = true;
                startBtn.innerHTML = '<div class="loading"></div> Starting Scan...';

                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(scanData)
                });

                const result = await response.json();

                if (result.success) {
                    currentScanId = result.scanId;
                    showStatusCard();
                    startStatusPolling();
                    showAlert('Scan started successfully!', 'success');
                } else {
                    throw new Error(result.error || 'Failed to start scan');
                }

            } catch (error) {
                showAlert(`Error starting scan: ${error.message}`, 'error');
            } finally {
                const startBtn = document.getElementById('startScanBtn');
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-play"></i> Start Scan';
            }
        }

        function showStatusCard() {
            document.getElementById('statusCard').classList.add('show');
        }

        function startStatusPolling() {
            if (statusInterval) {
                clearInterval(statusInterval);
            }

            statusInterval = setInterval(async () => {
                await checkStatus();
            }, 2000);
        }

        async function checkStatus() {
            if (!currentScanId) return;

            try {
                const response = await fetch(`/api/status/${currentScanId}`);
                const status = await response.json();

                updateStatusDisplay(status);

                if (status.status === 'completed' || status.status === 'failed') {
                    clearInterval(statusInterval);
                    if (status.status === 'completed') {
                        await loadResults();
                    }
                }

            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function updateStatusDisplay(status) {
            const statusInfo = document.getElementById('statusInfo');
            const progressFill = document.getElementById('progressFill');

            // Calculate progress
            const progress = status.progress ? 
                (status.progress.pagesScanned / Math.max(status.progress.pagesScanned + status.progress.pendingUrls, 1)) * 100 : 0;
            
            progressFill.style.width = `${progress}%`;

            // Update status info
            statusInfo.innerHTML = `
                <div class="status-item">
                    <div class="number">${status.progress?.pagesScanned || 0}</div>
                    <div class="label">Pages Scanned</div>
                </div>
                <div class="status-item">
                    <div class="number">${status.progress?.totalMatches || 0}</div>
                    <div class="label">Matches Found</div>
                </div>
                <div class="status-item">
                    <div class="number">${status.progress?.pendingUrls || 0}</div>
                    <div class="label">Pending URLs</div>
                </div>
                <div class="status-item">
                    <div class="number">${status.status}</div>
                    <div class="label">Status</div>
                </div>
            `;
        }

        async function loadResults() {
            try {
                const response = await fetch(`/api/results/${currentScanId}`);
                const results = await response.json();

                displayResults(results);
                showAlert(`Scan completed! Found ${results.totalMatches} matches.`, 'success');

            } catch (error) {
                showAlert(`Error loading results: ${error.message}`, 'error');
            }
        }

        function displayResults(results) {
            const resultsCard = document.getElementById('resultsCard');
            const resultsContent = document.getElementById('resultsContent');

            if (results.matches && results.matches.length > 0) {
                const table = `
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Keyword</th>
                                <th>URL</th>
                                <th>Context</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.matches.map(match => `
                                <tr>
                                    <td><strong>${match.keyword}</strong></td>
                                    <td><a href="${match.url}" target="_blank">${match.url}</a></td>
                                    <td>${match.context}</td>
                                    <td>${new Date(match.timestamp).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                resultsContent.innerHTML = table;
            } else {
                resultsContent.innerHTML = '<p>No matches found.</p>';
            }

            resultsCard.style.display = 'block';
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(alert, container.firstChild);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Handle Enter key in keyword input
        document.getElementById('keywordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addKeyword();
            }
        });
    </script>
</body>
</html>
