runtime: nodejs18

env_variables:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  GOOGLE_CLOUD_PROJECT: "your-project-id"
  GOOGLE_CLOUD_STORAGE_BUCKET: "term-spider-results"

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 10
  target_concurrent_requests: 100

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

handlers:
  - url: /.*
    script: auto
    secure: always

inbound_services:
  - warmup 