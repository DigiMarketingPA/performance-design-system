<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 100%;
            height: 100vh;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        .container {
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
        }
        
        .header {
            background: linear-gradient(135deg, #007cba 0%, #005a87 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        
        .header p {
            margin: 5px 0 0 0;
            opacity: 0.9;
            font-size: 12px;
        }
        
        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            font-size: 13px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #007cba;
        }
        
        .form-group input[readonly] {
            background-color: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
        }
        
        .form-group input[readonly]:focus {
            border-color: #e1e5e9;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .search-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007cba 0%, #005a87 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 15px;
        }
        
        .search-btn:hover {
            transform: translateY(-1px);
        }
        
        .search-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 8px 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .status.enabled {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disabled {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .toggle-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .toggle-btn.enable {
            background: #007cba;
            color: white;
        }
        
        .toggle-btn.disable {
            background: #dc3545;
            color: white;
        }
        
        .page-list {
            margin-top: 15px;
            flex: 1;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            background: #f8f9fa;
            display: none;
            max-height: 200px;
            overflow: hidden;
        }
        
        .page-list.show {
            display: block;
        }
        
        .page-list-header {
            background: #e3f2fd;
            padding: 8px 12px;
            border-bottom: 1px solid #e9ecef;
            font-weight: bold;
            color: #1976d2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .page-list-content {
            max-height: 150px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .page-item {
            padding: 6px 12px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }
        
        .page-item:last-child {
            border-bottom: none;
        }
        
        .page-item.found {
            background: #d4edda;
            border-left: 3px solid #28a745;
        }
        
        .page-item.not-found {
            background: #f8f9fa;
            border-left: 3px solid #6c757d;
        }
        
        .page-item.processing {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
        }
        
        .page-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }
        
        .page-status {
            font-weight: bold;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            min-width: 50px;
            text-align: center;
        }
        
        .page-status.found {
            background: #28a745;
            color: white;
        }
        
        .page-status.not-found {
            background: #6c757d;
            color: white;
        }
        
        .page-status.processing {
            background: #ffc107;
            color: #212529;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007cba;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            margin-top: 15px;
            display: none;
        }
        
        .results h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
        }
        
        .result-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .result-item h4 {
            margin: 0 0 5px 0;
            color: #007cba;
            font-size: 14px;
        }
        
        .result-item p {
            margin: 5px 0;
            font-size: 12px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        
        .download-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: none;
        }
        
        .download-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #218838 0%, #1ea085 100%);
        }
        
        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .control-btn:hover {
            transform: translateY(-1px);
        }
        
        .control-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #007cba 0%, #005a87 100%);
            color: white;
        }
        
        .stop-btn {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            display: none;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #212529;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Website Word Finder</h1>
            <p>Find words across entire websites</p>
        </div>
        
        <div class="content">
            <!-- CORS Bypass Status -->
            <div id="status" class="status disabled">
                CORS Bypass: Disabled
            </div>
            
            <button id="toggleBtn" class="toggle-btn enable">
                Enable CORS Bypass
            </button>
            
            <!-- Search Form -->
            <div class="form-group">
                <label for="baseUrl">Current Website:</label>
                <input type="url" id="baseUrl" placeholder="Detecting current site..." readonly>
            </div>
            
            <div class="form-group">
                <label for="searchTerms">Search Terms (comma-separated):</label>
                <textarea id="searchTerms" rows="3" placeholder="warranty, service, maintenance" required></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="maxDepth">Max Depth:</label>
                    <select id="maxDepth">
                        <option value="1">1 level</option>
                        <option value="2">2 levels</option>
                        <option value="3" selected>3 levels</option>
                        <option value="4">4 levels</option>
                        <option value="5">5 levels</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="maxPages">Max Pages:</label>
                    <select id="maxPages">
                        <option value="50">50 pages</option>
                        <option value="100" selected>100 pages</option>
                        <option value="200">200 pages</option>
                        <option value="500">500 pages</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="delay">Delay (ms):</label>
                    <select id="delay">
                        <option value="500">500ms</option>
                        <option value="1000" selected>1000ms</option>
                        <option value="2000">2000ms</option>
                        <option value="3000">3000ms</option>
                    </select>
                </div>
            </div>
            
            <div class="control-buttons">
                <button id="searchBtn" class="control-btn start-btn">
                    🔍 Start Search
                </button>
                <button id="stopBtn" class="control-btn stop-btn">
                    ⏹️ Stop Search
                </button>
                <button id="restartBtn" class="control-btn restart-btn">
                    🔄 Restart Search
                </button>
            </div>
            
            <!-- Loading -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Searching website...</p>
            </div>
            
            <!-- Real-time Page List -->
            <div id="pageList" class="page-list">
                <div class="page-list-header">
                    <span>Pages Found</span>
                    <span id="pageCount">0 pages</span>
                </div>
                <div id="pageListContent" class="page-list-content"></div>
            </div>
            
            <!-- Results -->
            <div id="results" class="results">
                <div id="resultsContent"></div>
            </div>
            
            <!-- Download CSV Button -->
            <button id="downloadBtn" class="download-btn">
                📊 Download CSV Report
            </button>
        </div>
    </div>
    
    <script src="panel.js"></script>
</body>
</html>
